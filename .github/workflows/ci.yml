# Every push: typecheck, lint, formatting, unit/API tests and the end-to-end suite in Chromium
# and WebKit (Safari's engine) at desktop and phone sizes; then the Docker image is built and
# smoke-tested. Green pushes to main also publish the image to Docker Hub, once the
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets exist (until then that step is
# skipped, not failed).
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
        env:
          E2E_WEBKIT: "1"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: syhr/syhrsh
      # Secrets can't be tested in `if:` directly; exposing them as env makes an unset one "".
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Build the image for this runner
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: syhrsh:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: node scripts/docker-smoke.ts syhrsh:ci

      - name: Decide whether to publish
        id: publish
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Not publishing: only green pushes to main publish, and only once the Docker Hub secrets are set."
          fi
      - if: steps.publish.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - if: steps.publish.outputs.enabled == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - if: steps.publish.outputs.enabled == 'true'
        name: Publish for amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
